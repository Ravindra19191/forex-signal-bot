name: Forex Signal Bot

on:
  schedule:
    - cron: '0 * * * *' # සෑම පැයකට වතාවක්ම ස්වයංක්‍රීයව ක්‍රියාත්මක වේ
  workflow_dispatch: # ඕනෑම වෙලාවක අතින් (Manual) රන් කිරීමට

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m larch --upgrade pip || true
          pip install pandas numpy requests

      - name: Run bot script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
